# Include inside the existing ThreadPeak static-site server block.
# /media contains versioned public files; missing media must never return index.html.
location ^~ /media/ {
    try_files $uri =404;
    sendfile on;
    sendfile_max_chunk 1m;
    max_ranges 1;
    gzip off;
    etag on;
    # expires preserves the server's inherited add_header security policy.
    expires 365d;
    access_log off;
    log_not_found off;
}
