<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">问山 ThreadPeak 系统流程架构</title>
  <desc id="architecture-desc">一次用户操作从 React 工作区进入 Fastify API，写入 PostgreSQL 后由持久任务引擎领取，再进入路线、学习或作者工作流，通过统一 Provider 网关访问模型、知乎、全网搜索与 PDF 服务，结果原子提交后通过快照和 SSE 返回浏览器。</desc>
  <defs>
    <linearGradient id="architecture-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcff"/><stop offset="0.55" stop-color="#f4f8fc"/><stop offset="1" stop-color="#f7f4ff"/></linearGradient>
    <linearGradient id="architecture-brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2379ed"/><stop offset="0.5" stop-color="#37bbb7"/><stop offset="1" stop-color="#7b65e4"/></linearGradient>
    <pattern id="architecture-dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#91a7b8" opacity="0.14"/></pattern>
    <filter id="architecture-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="11" stdDeviation="17" flood-color="#243c50" flood-opacity="0.09"/></filter>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7f94a7"/></marker>
    <marker id="architecture-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2379ed"/></marker>
    <marker id="architecture-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2da39b"/></marker>
    <style>
      text { font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #192836; }
      .eyebrow { font-size: 18px; font-weight: 650; letter-spacing: 3px; fill: #2379ed; }.title { font-size: 43px; font-weight: 720; letter-spacing: -0.5px; }.subtitle { font-size: 20px; font-weight: 450; fill: #657789; }
      .step { font-size: 17px; font-weight: 700; letter-spacing: 1.6px; fill: #2379ed; }.node-title { font-size: 25px; font-weight: 680; }.gateway-title { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }.node-copy { font-size: 18px; font-weight: 450; fill: #67798a; }.mini-title { font-size: 19px; font-weight: 660; }.mini-copy { font-size: 16px; font-weight: 450; fill: #6b7d8d; }.connector-label { font-size: 15px; font-weight: 620; fill: #708498; }
      .on-dark { fill: #ffffff; }.on-dark-muted { fill: #d4dee7; }
      .flow { fill: none; stroke: #7f94a7; stroke-width: 3; marker-end: url(#architecture-arrow); }.data-flow { fill: none; stroke: #2da39b; stroke-width: 3.2; marker-end: url(#architecture-arrow-green); }.return-flow { fill: none; stroke: #2379ed; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#architecture-arrow-blue); }
    </style>
  </defs>
  <rect width="1800" height="980" rx="34" fill="url(#architecture-bg)"/><rect width="1800" height="980" rx="34" fill="url(#architecture-dots)"/>
  <rect x="58" y="43" width="10" height="106" rx="5" fill="url(#architecture-brand)"/><text class="eyebrow" x="92" y="68">SYSTEM FLOW ARCHITECTURE</text><text class="title" x="92" y="116">一次操作怎样穿过问山系统</text><text class="subtitle" x="92" y="151">先持久化，再执行；先校验证据，再发布；刷新与断线不会让任务消失</text>
  <g id="primary-flow" transform="translate(58 224)">
    <path class="flow" d="M230 172H274"/><path class="flow" d="M524 172H568"/><path class="flow" d="M818 172H862"/><path class="flow" d="M1192 172H1236"/><path class="flow" d="M1466 172H1510"/>
    <text class="connector-label" x="235" y="155">命令</text><text class="connector-label" x="529" y="155">任务</text><text class="connector-label" x="823" y="155">领取</text><text class="connector-label" x="1203" y="155">调用</text><text class="connector-label" x="1471" y="155">请求</text>
    <g id="browser-node"><rect width="230" height="344" rx="30" fill="#ffffff" stroke="#d9e5ee" filter="url(#architecture-shadow)"/><text class="step" x="24" y="38">01 · 浏览器</text><text class="node-title" x="24" y="78">React 工作区</text><rect x="24" y="105" width="182" height="48" rx="16" fill="#edf4ff"/><text class="node-copy" x="43" y="135">目标与 AI 访谈</text><rect x="24" y="165" width="182" height="48" rx="16" fill="#f2f7fb"/><text class="node-copy" x="43" y="195">3D 学习路线</text><rect x="24" y="225" width="182" height="48" rx="16" fill="#f2f7fb"/><text class="node-copy" x="43" y="255">概念无限画布</text><rect x="24" y="285" width="182" height="35" rx="17.5" fill="#f0ecff"/><text class="mini-copy" x="47" y="308" fill="#6d59cc">问 AI · 问博主</text></g>
    <g id="api-node" transform="translate(274)"><rect width="250" height="344" rx="30" fill="#ffffff" stroke="#d9e5ee" filter="url(#architecture-shadow)"/><text class="step" x="24" y="38">02 · 接收</text><text class="node-title" x="24" y="78">Fastify API</text><text class="node-copy" x="24" y="117">身份与资源所有者校验</text><text class="node-copy" x="24" y="149">命令、幂等键与附件</text><path d="M24 174H226" stroke="#e1e9ef"/><text class="mini-title" x="24" y="208">同源服务边界</text><text class="mini-copy" x="24" y="238">HTTPS · Cookie · CSRF</text><text class="mini-copy" x="24" y="267">浏览器不持有 Provider 密钥</text><rect x="24" y="291" width="202" height="30" rx="15" fill="#eef8f5"/><text class="mini-copy" x="49" y="312" fill="#278f88">先写入任务，再返回接收</text></g>
    <g id="worker-node" transform="translate(568)"><rect width="250" height="344" rx="30" fill="#ffffff" stroke="#d3e8e4" filter="url(#architecture-shadow)"/><text class="step" x="24" y="38" fill="#278f88">03 · 执行</text><text class="node-title" x="24" y="78">Durable Worker</text><text class="node-copy" x="24" y="117">从数据库领取待办任务</text><text class="node-copy" x="24" y="149">按检查点恢复未完成步骤</text><path d="M24 174H226" stroke="#dcebe8"/><text class="mini-title" x="24" y="208">运行保护</text><text class="mini-copy" x="24" y="238">租约 · 取消栅栏 · 有界重试</text><text class="mini-copy" x="24" y="267">迟到结果拒绝提交</text><rect x="24" y="291" width="202" height="30" rx="15" fill="#eef8f5"/><text class="mini-copy" x="53" y="312" fill="#278f88">刷新不会取消任务</text></g>
    <g id="workflows-node" transform="translate(862)"><rect width="330" height="344" rx="30" fill="#ffffff" stroke="#d9e5ee" filter="url(#architecture-shadow)"/><text class="step" x="24" y="38">04 · 固定编排</text><text class="node-title" x="24" y="78">三条业务工作流</text><g transform="translate(24 104)"><rect width="282" height="62" rx="18" fill="#edf4ff"/><text class="mini-title" x="18" y="27">路线工作流</text><text class="mini-copy" x="18" y="49">检索 → 访谈 → 路线编译</text></g><g transform="translate(24 178)"><rect width="282" height="62" rx="18" fill="#edf8f5"/><text class="mini-title" x="18" y="27">学习工作流</text><text class="mini-copy" x="18" y="49">资料筛选 → 教学 → 长卡</text></g><g transform="translate(24 252)"><rect width="282" height="62" rx="18" fill="#f1edff"/><text class="mini-title" x="18" y="27">作者工作流</text><text class="mini-copy" x="18" y="49">公开内容 → 作者卡 → 网络</text></g></g>
    <g id="gateway-node" transform="translate(1236)"><rect width="230" height="344" rx="30" fill="#ffffff" stroke="#ddd7f2" filter="url(#architecture-shadow)"/><text class="step" x="24" y="38" fill="#6c58cc">05 · 统一出口</text><text class="gateway-title" x="24" y="78">Provider Gateway</text><text class="node-copy" x="24" y="120">上下文与输出预算</text><text class="node-copy" x="24" y="153">结构校验与证据回查</text><text class="node-copy" x="24" y="186">知乎两路并发与限流冷却</text><path d="M24 212H206" stroke="#e5e0f4"/><text class="mini-copy" x="24" y="246">模型与外部 API</text><text class="mini-copy" x="24" y="274">都从服务端受控访问</text><rect x="24" y="295" width="182" height="28" rx="14" fill="#f1edff"/><text class="mini-copy" x="48" y="315" fill="#6c58cc">失败不伪装成功</text></g>
    <g id="external-node" transform="translate(1510)"><rect width="232" height="344" rx="30" fill="#172a3b" filter="url(#architecture-shadow)"/><text class="step" x="24" y="38" fill="#86baff">06 · 外部能力</text><text class="node-title on-dark" x="24" y="78">受控 Provider</text><rect x="24" y="105" width="184" height="48" rx="16" fill="#263e53"/><text class="node-copy on-dark-muted" x="46" y="135">模型服务</text><rect x="24" y="165" width="184" height="48" rx="16" fill="#263e53"/><text class="node-copy on-dark-muted" x="46" y="195">知乎开放平台</text><rect x="24" y="225" width="184" height="48" rx="16" fill="#263e53"/><text class="node-copy on-dark-muted" x="46" y="255">全网搜索</text><rect x="24" y="285" width="184" height="35" rx="17.5" fill="#263e53"/><text class="mini-copy on-dark-muted" x="51" y="308">PDF 解析与恢复</text></g>
  </g>
  <g id="persistence-and-return">
    <path class="data-flow" d="M457 568V675H638"/><text class="connector-label" x="470" y="650" fill="#278f88">保存资源与任务</text><path class="data-flow" d="M751 568V628H850V675"/><path class="data-flow" d="M1085 568V675"/><text class="connector-label" x="944" y="650" fill="#278f88">原子提交结果</text>
    <g id="database-node" transform="translate(638 675)"><rect width="660" height="190" rx="30" fill="#ffffff" stroke="#cfe5e1" filter="url(#architecture-shadow)"/><text class="step" x="28" y="41" fill="#278f88">唯一事实源</text><text class="node-title" x="28" y="81">PostgreSQL</text><text class="node-copy" x="28" y="117">目标与访谈 · 路线文档 · 任务与事件 · 知识卡 · 作者关系</text><g transform="translate(28 139)"><rect width="132" height="30" rx="15" fill="#edf8f5"/><text class="mini-copy" x="26" y="21" fill="#278f88">检查点</text><rect x="144" width="132" height="30" rx="15" fill="#edf8f5"/><text class="mini-copy" x="170" y="21" fill="#278f88">revision</text><rect x="288" width="132" height="30" rx="15" fill="#edf8f5"/><text class="mini-copy" x="318" y="21" fill="#278f88">幂等键</text><rect x="432" width="180" height="30" rx="15" fill="#edf8f5"/><text class="mini-copy" x="461" y="21" fill="#278f88">所有者边界</text></g></g>
    <g id="snapshot-node" transform="translate(326 699)"><rect width="250" height="142" rx="28" fill="#ffffff" stroke="#d8e4ee" filter="url(#architecture-shadow)"/><text class="step" x="24" y="39">返回浏览器</text><text class="node-title" x="24" y="78">Snapshot + SSE</text><text class="node-copy" x="24" y="112">快照、revision、断线恢复</text></g>
    <path class="return-flow" d="M638 770H576"/><path class="return-flow" d="M326 770H160V568"/><text class="connector-label" x="178" y="750" fill="#2379ed">重新连接后继续</text>
  </g>
  <g id="architecture-note"><rect x="58" y="910" width="1684" height="42" rx="21" fill="#eaf1f7"/><text class="connector-label" x="90" y="937">阅读顺序：浏览器命令 → API 持久化 → Worker 领取 → 固定业务工作流 → 统一外部调用 → PostgreSQL 提交 → SSE 恢复界面</text></g>
</svg>
